<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 507" role="img" aria-labelledby="t d">
  <title id="t">Invictibellatrix amberina, dinosaurio de garras gigantes</title>
  <desc id="d">Ilustración editorial de un dinosaurio terópodo oscuro con brazos largos y garras curvas, sobre un fondo de museo y un cajón de fósiles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173864"/><stop offset="1" stop-color="#244d78"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b5738"/><stop offset="1" stop-color="#3f2d28"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="900" height="507" fill="url(#sky)"/>
  <circle cx="770" cy="92" r="54" fill="#efb020" opacity=".8"/>
  <circle cx="770" cy="92" r="76" fill="none" stroke="#f7d979" stroke-width="3" opacity=".45"/>
  <path d="M0 372h900v135H0z" fill="url(#ground)"/>
  <path d="M0 374h900" stroke="#efb020" stroke-width="6" opacity=".8"/>
  <ellipse cx="457" cy="412" rx="275" ry="33" fill="#17151b" opacity=".55" filter="url(#shadow)"/>
  <!-- dinosaur silhouette -->
  <path d="M208 344c18-45 50-75 95-89 23-7 43-26 52-55 7-23 20-45 43-57 28-15 62-9 87 12 21 17 38 40 64 48 28 9 66 1 91 18 19 13 28 35 24 55-5 24-30 33-53 31-37-3-63-18-88-29-18-8-32-8-42 5-13 17-11 51-5 75l32 52h-48l-35-57c-14-23-18-48-15-71-30 11-51 32-61 62l-18 66h-45l20-83c-22 11-43 26-56 48l-29 35h-55z" fill="#171923" stroke="#0c101b" stroke-width="7" stroke-linejoin="round"/>
  <!-- tail -->
  <path d="M300 287c-58 5-95-14-138-39-33-19-73-28-111-14 43-28 85-42 129-34 55 10 86 29 139 35z" fill="#171923" stroke="#0c101b" stroke-width="7"/>
  <!-- head and snout -->
  <path d="M470 155c27-22 60-18 83 1l37 10-8 19-50 5-31 25-40-17z" fill="#171923" stroke="#0c101b" stroke-width="7"/>
  <circle cx="520" cy="166" r="5" fill="#efb020"/>
  <!-- claws -->
  <path d="M425 300q-31 37-43 70M442 305q-22 43-24 75M461 307q-8 44 5 73" fill="none" stroke="#efb020" stroke-width="9" stroke-linecap="round"/>
  <path d="M382 370l-13 18M418 380l-5 19M466 380l7 18" stroke="#f7d979" stroke-width="5" stroke-linecap="round"/>
  <!-- fossil drawer -->
  <rect x="54" y="48" width="205" height="76" rx="8" fill="#fff5d2" stroke="#171923" stroke-width="5"/>
  <text x="72" y="78" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#173864">MUSEO · FÓSIL 1923</text>
  <text x="72" y="104" font-family="Arial,sans-serif" font-size="14" fill="#7b5738">casi un siglo en un cajón</text>
  <path d="M73 445h754" stroke="#efb020" stroke-width="2" opacity=".5"/>
  <text x="58" y="482" font-family="Arial,sans-serif" font-size="17" letter-spacing="2" fill="#fff5d2">INVICTIBELLATRIX AMBERINA · CIENCIA AL LÍMITE</text>
</svg>
